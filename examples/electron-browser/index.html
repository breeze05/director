<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electron 浏览器 Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #1c2128;
      --border: #30363d;
      --accent: #58a6ff;
      --text: #c9d1d9;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 14px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: #f0f6fc;
    }

    .hint {
      font-size: 13px;
      color: #8b949e;
    }

    form {
      display: flex;
      gap: 8px;
      width: 100%;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0d1117;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
    }

    .controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    button {
      border: 1px solid var(--border);
      background: #161b22;
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
      font-size: 14px;
    }

    button:hover {
      background: #1f2a35;
      border-color: var(--accent);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: var(--border);
    }

    #status {
      min-width: 60px;
      text-align: right;
      font-size: 12px;
      color: #8b949e;
    }

    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 18px 10px;
      background: #0f141b;
      border-bottom: 1px solid var(--border);
    }

    .toolbar-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .view {
      flex: 1;
      border-top: 1px solid var(--border);
      overflow: hidden;
    }

    webview {
      width: 100%;
      height: 100%;
      border: 0;
      background: #0d1117;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Electron 浏览器 Demo</h1>
      <div class="hint">示例：输入任意网址并在内嵌浏览器中查看</div>
    </div>
    <div id="status">加载中…</div>
  </header>

  <div class="toolbar">
    <div class="toolbar-row">
      <div class="controls">
        <button id="back" title="后退">⟵</button>
        <button id="forward" title="前进">⟶</button>
        <button id="reload" title="刷新">⟳</button>
        <button id="home" title="首页">⌂</button>
      </div>
      <form id="browser-form">
        <input id="address" type="text" value="https://www.google.com" aria-label="地址栏">
        <button type="submit">前往</button>
      </form>
    </div>
  </div>

  <div class="view">
    <webview
      id="browser"
      src="https://www.google.com"
      allowpopups
      disableblinkfeatures="Auxclick"
    ></webview>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
